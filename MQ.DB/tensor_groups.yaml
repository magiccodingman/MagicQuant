schema_version: 1

groups:
  embeddings:
    description: "Token embedding matrices."
    patterns:
      - "token_embd\\.weight"
      - "model\\.embed_tokens\\.weight"
      - "embed_tokens\\.weight"
      - "tok_embeddings\\.weight"
      - "word_embeddings\\.weight"
      - "transformer\\.wte\\.weight"
      - "wte\\.weight"

  lm_head:
    description: "Final output/logit projection tensors."
    patterns:
      - "output\\.weight"
      - "lm_head\\.weight"
      - "final_logits_proj\\.weight"
      - "model\\.embed_out\\.weight"
      - "lm_head\\.decoder\\.weight"

  attn_q:
    description: "Attention query projection tensors."
    patterns:
      # llama.cpp GGUF form, e.g. blk.0.attn_q.weight
      - "blk\\..*\\.attn_q\\.weight"

      # LLaMA / Qwen / Mistral / modern HF forms.
      - ".*q_proj.*weight"
      - ".*self_attn\\.q_proj\\.weight"

      # BERT / encoder style forms.
      - ".*query\\.weight"
      - ".*attention\\.self\\.query\\.weight"

      # T5 / miscellaneous forms.
      - ".*SelfAttention\\.q\\.weight"

      # Fused QKV forms.
      # These may intentionally match broader attention tensors and should be
      # handled carefully by the learning/ambiguity layer.
      - ".*c_attn\\.weight"
      - ".*query_key_value\\.weight"

  attn_kv:
    description: "Attention key/value projection tensors."
    patterns:
      # llama.cpp GGUF forms.
      - "blk\\..*\\.attn_k\\.weight"
      - "blk\\..*\\.attn_v\\.weight"

      # LLaMA / Qwen / Mistral / modern HF forms.
      - ".*k_proj.*weight"
      - ".*v_proj.*weight"
      - ".*self_attn\\.k_proj\\.weight"
      - ".*self_attn\\.v_proj\\.weight"

      # BERT / encoder style forms.
      - ".*key\\.weight"
      - ".*value\\.weight"
      - ".*attention\\.self\\.key\\.weight"
      - ".*attention\\.self\\.value\\.weight"

      # T5 / encoder-decoder style forms.
      - ".*SelfAttention\\.k\\.weight"
      - ".*SelfAttention\\.v\\.weight"
      - ".*EncDecAttention\\.k\\.weight"
      - ".*EncDecAttention\\.v\\.weight"

  attn_output:
    description: "Attention output projection tensors."
    patterns:
      # llama.cpp GGUF form.
      - "blk\\..*\\.attn_output\\.weight"

      # LLaMA / Qwen / Mistral / modern HF forms.
      - ".*out_proj.*weight"
      - ".*o_proj.*weight"
      - ".*self_attn\\.out_proj\\.weight"

      # GPT-style attention output.
      # Note: c_proj can also appear in MLPs on some architectures, so this may
      # require architecture-aware disambiguation or strict ambiguity reporting.
      - ".*c_proj\\.weight"

      # BERT / encoder style forms.
      - ".*attention\\.output\\.dense\\.weight"
      - ".*self_attention\\.dense\\.weight"
      - ".*attention\\.proj\\.weight"

      # T5 / miscellaneous forms.
      - ".*SelfAttention\\.o\\.weight"

  ffn_up_gate:
    description: "Dense FFN up/gate tensors. Expert-path tensors should generally be owned by moe_experts."
    patterns:
      # llama.cpp GGUF dense FFN forms.
      - "blk\\..*\\.ffn_up\\.weight"
      - "blk\\..*\\.ffn_gate\\.weight"

      # BERT / encoder style forms.
      - ".*intermediate\\.dense\\.weight"

      # GPT / MLP style forms.
      - ".*c_fc\\.weight"
      - ".*fc1\\.weight"
      - ".*fc_in\\.weight"
      - ".*dense_h_to_4h\\.weight"

      # T5 / gated FFN style forms.
      - ".*wi\\.weight"
      - ".*wi_0\\.weight"
      - ".*wi_1\\.weight"
      - ".*DenseReluDense\\.wi_0\\.weight"
      - ".*DenseReluDense\\.wi_1\\.weight"

      # LLaMA / Qwen / Mistral / modern dense MLP forms.
      - ".*mlp\\.up_proj\\.weight"
      - ".*mlp\\.gate_proj\\.weight"

      # Qwen3.5 / Qwen3.6 / modern expert forms.
      # These were added for newer MoE architectures, but if strict collision
      # detection is enabled, moe_experts should usually own these instead.
      - ".*experts.*wi_0\\.weight"
      - ".*experts.*wi_1\\.weight"
      - "blk\\..*\\.ffn_up_exps\\.weight"
      - "blk\\..*\\.ffn_gate_exps\\.weight"
      - ".*mlp\\.experts\\.gate_up_proj.*"
      - ".*mlp\\.shared_expert\\.gate_proj\\.weight"
      - ".*mlp\\.shared_expert\\.up_proj\\.weight"

      # Gemma-style MoE forms.
      - ".*layers\\..*\\.experts\\.gate_up_proj.*"

  ffn_down:
    description: "Dense FFN down-projection tensors. Expert-path tensors should generally be owned by moe_experts."
    patterns:
      # llama.cpp GGUF dense FFN form.
      - "blk\\..*\\.ffn_down\\.weight"

      # BERT / encoder style form.
      - ".*output\\.dense\\.weight"

      # GPT / MLP style forms.
      # Note: c_proj can also appear as attention output on some architectures.
      # Let the matching layer report ambiguity if the model family cannot
      # distinguish it cleanly.
      - ".*c_proj\\.weight"
      - ".*fc2\\.weight"
      - ".*fc_out\\.weight"
      - ".*dense_4h_to_h\\.weight"

      # T5 / gated FFN style forms.
      - ".*wo\\.weight"
      - ".*DenseReluDense\\.wo\\.weight"

      # LLaMA / Qwen / Mistral / modern dense MLP form.
      - ".*mlp\\.down_proj\\.weight"

      # Qwen3.5 / Qwen3.6 / modern expert forms.
      # These were added for newer MoE architectures, but if strict collision
      # detection is enabled, moe_experts should usually own these instead.
      - ".*experts.*wo\\.weight"
      - "blk\\..*\\.ffn_down_exps\\.weight"
      - ".*mlp\\.experts\\.down_proj.*"
      - ".*mlp\\.shared_expert\\.down_proj\\.weight"

      # Gemma-style MoE forms.
      - ".*layers\\..*\\.experts\\.down_proj.*"

  moe_experts:
    description: "MoE expert-path tensors, including shared experts."
    patterns:
      # llama.cpp GGUF MoE expert tensors.
      # These intentionally own the *_exps forms so they do not collide with
      # dense ffn_up_gate / ffn_down groups.
      - "blk\\..*\\.ffn_.*expert.*"
      - "blk\\..*\\.ffn_.*exps.*"
      - "blk\\..*\\.ffn_up_exps\\.weight"
      - "blk\\..*\\.ffn_gate_exps\\.weight"
      - "blk\\..*\\.ffn_down_exps\\.weight"

      # Generic expert container forms used by several HF architectures.
      - ".*experts?\\..*wi_0.*"
      - ".*experts?\\..*wi_1.*"
      - ".*experts?\\..*wo.*"
      - ".*experts?\\..*fc1.*"
      - ".*experts?\\..*fc2.*"
      - ".*experts?\\..*dense_h_to_4h.*"
      - ".*experts?\\..*dense_4h_to_h.*"
      - ".*experts?\\..*up_proj.*"
      - ".*experts?\\..*gate_proj.*"
      - ".*experts?\\..*down_proj.*"

      # Qwen3.5 / Qwen3.6 / modern HF MoE forms.
      - ".*mlp\\.experts\\.gate_up_proj.*"
      - ".*mlp\\.experts\\.gate_proj.*"
      - ".*mlp\\.experts\\.up_proj.*"
      - ".*mlp\\.experts\\.down_proj.*"

      # Shared experts are still MoE expert-path tensors, not normal dense FFN.
      # Keeping them here prevents them from double-counting as generic FFN.
      - ".*mlp\\.shared_expert\\.gate_proj\\.weight"
      - ".*mlp\\.shared_expert\\.up_proj\\.weight"
      - ".*mlp\\.shared_expert\\.down_proj\\.weight"

      # Gemma-style MoE forms.
      - ".*layers\\..*\\.experts\\.gate_up_proj.*"
      - ".*layers\\..*\\.experts\\.gate_proj.*"
      - ".*layers\\..*\\.experts\\.up_proj.*"
      - ".*layers\\..*\\.experts\\.down_proj.*"

  moe_router:
    description: "MoE router/gating tensors."
    patterns:
      - "router.*"
      - "gating.*"
      - "routing.*"

      # Generic gate/router forms.
      # Negative lookbehind prevents ffn_gate.weight from being treated as router.
      - ".*(?<!ffn_)gate\\.weight"
      - ".*gating_network\\.weight"
      - ".*moe_gate\\.weight"

      # llama.cpp GGUF MoE router/gate forms.
      - "blk\\..*\\.ffn_gate_inp\\.weight"
      - "blk\\..*\\.gate_inp\\.weight"
      - "blk\\..*\\.gate_proj\\.weight"
      - "blk\\..*\\.router.*"
      - "blk\\..*\\.router_fc.*"

      # Qwen3.5 / Qwen3.6 native HF MoE router.
      - ".*mlp\\.gate\\.weight"

      # Gemma-style router tensors.
      - ".*layers\\..*\\.router\\.proj\\.weight"
      - ".*layers\\..*\\.router\\.per_expert_scale"
      - ".*layers\\..*\\.router\\.scale"

base_quant_exceptions:
  description: "Tensor patterns that are allowed to fall back to the artifact BaseQuant instead of belonging to a semantic tensor group. These should only be checked after zero semantic groups match."
  patterns:
    # Small scale / calibration / architecture-helper tensors.
    # Keep this intentionally conservative. If any scale tensor becomes large or
    # materially impacts KLD/PPL/TPS, promote it to a real tensor group instead.
    - ".*scale.*"

    # Zero-point / quantization-helper tensors.
    - ".*zero.*"

    # Normalization tensors.
    # These are usually tiny, structurally important, and not useful as search groups.
    - ".*norm.*"

    # Positional / position-helper tensors.
    - ".*position.*"