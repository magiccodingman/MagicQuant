name: .NET checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MagicQuant-Pipeline.sln
      - run: dotnet build MagicQuant-Pipeline.sln --configuration ${{ matrix.configuration }} --no-restore
      - run: dotnet test MagicQuant-Pipeline.sln --configuration ${{ matrix.configuration }} --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults/*.trx
