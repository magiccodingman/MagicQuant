paths:
  magic_quant_root:
  model_dir: /mnt/world8/AI/Models/Qwen3.8-27B-Qwen/
  llama_root:
  llama_bin:
  convert_script:
  scratch_roots:
    - /mnt/world8/
    - /home/slurp/
    - /mnt/world7/
  external_baseline_cache_dir_name: ExternalBaselines

flags:
  use_imatrix: true
  force_imatrix_rebuild: false
  force_refresh_hardware_probe: false
  allow_high_precision_hybrids: false

learning:
  # Destructive relearn options are intentionally targeted.
  # These are transient runtime commands and are not persisted as DB state.
  # When any option below is enabled, MagicQuant prints a count summary and asks
  # for confirmation before deleting/relearning anything.
  #
  # Deletes learned mappings, benchmark truth, dependent benchmark/source rows,
  # and execution probe cache rows scoped to the active architecture family.
  # Does not delete AiModelHash, ArchitectureFamily, ImatrixDefinition,
  # TensorCombo, or BaselineQuantDefinition rows.
  force_relearn_architecture_family: false

  # Relearn built-in/standard baselines by display/canonical name for the current
  # architecture family and active tensor group profile.
  # Example:
  # force_relearn_standard_baselines:
  #   - Q6_K
  #   - IQ4_XS
  force_relearn_standard_baselines: []
  
  # Safety gate for tensor group regex/profile changes. After MagicQuant reads the
  # native BF16 GGUF tensor list, it prints group counts, example tensors,
  # ambiguous matches, unresolved tensors, and base-quant exception counts, then
  # asks before continuing. Keep this true unless running fully unattended.
  confirm_tensor_group_profile: true

  # Safe/idempotent repair mode for accidental regex mistakes.
  #
  # Default true: on every run MagicQuant checks whether older DB learned tensor
  # truth can be copied into the active TensorGroupProfile by reapplying the
  # current regex/base_quant_exceptions rules. If nothing changed or current rows
  # already exist, it skips cleanly and does not create duplicates.
  #
  # This avoids needless re-download/re-quantization of pure learning baselines
  # after regex-only regrouping. Old benchmarks/learned rows remain attached to
  # their original TensorGroupProfile and are ignored unless that profile becomes
  # active again.
  #
  # Disable only when you intentionally want the slower/full path to regenerate
  # learned grouping truth instead of rebucketing from DB snapshots.
  # CLI disable aliases:
  #   --no-rebucket-learned-tensor-groups
  #   --disable-tensor-group-rebucket
  #   --full-relearn-tensor-groups
  rebucket_learned_tensor_groups_from_existing_truth: true


readme:
  # Optional title model name override used in:
  #   # MagicQuant Hybrids (v2.0) - <name>
  # If blank, MagicQuant uses identity.architecture_family_name.
  title_model_name_override: Qwen3.8-27B

  # Hugging Face README frontmatter.
  # Scalars render as:
  #   license: apache-2.0
  # Arrays render as:
  #   tags:
  #   - gguf
  #   - text-generation
  #
  # Add more keys freely, such as base_model, datasets, language, pipeline_tag, etc.
  frontmatter:
    license: apache-2.0
    tags:
      - gguf
      - text-generation
      - magicquant
      - conversational
    base_model:
      - Qwen/Qwen3.8-27B

hardware:
  gpu_memory_limits_gb:
    0: 19
    1: 23

imatrix:
  imatrix_url:
  dataset_repo:
  dataset_split: text
  dataset_config:
  dataset_local_file: /home/slurp/Documents/Output_Files/Dataset/artifacts/imatrix-general-v1-1_5m.jsonl

# Legacy evolution survivor knobs were removed from YAML.
# Final hybrid selection is now driven by rank-safe isolation prediction plus candidate_selection.

isolation_pruning:
  # 0.04 is the goal, but this is currently causing prediction issues, leave at 0
  minimum_isolation_reduction_to_continue_ratio: 0.00
  minimum_isolation_reduction_to_suppress_bf16_ratio: 0.10
  maximum_isolation_ppl_delta_percent: 5.0
  maximum_isolation_kld: 0.1
  bad_trade_max_size_delta_percent: 4.0
  bad_trade_kld_multiplier: 2.5
  bad_trade_ppl_multiplier: 3.5
  floating_point_epsilon: 1.0e-8
  minimum_meaningful_base_only_reduction_ratio: 0.01


prediction:
  # Rank-safe isolation KLD predictor.
  #
  # manual_max_predicted_size_bytes is retained only as an emergency compatibility
  # field for older helper code. Leave it at 0 for the new chooser.
  manual_max_predicted_size_bytes: 0

  # Candidate bit-stress thresholds for the low-bit interaction correction.
  # The predictor fits each candidate threshold against existing category=General
  # benchmark truth and keeps the best MAE fit for the active model/imatrix bucket.
  bit_stress_threshold_candidates:
    - 4.0
    - 5.0
    - 6.0
    - 7.0
    - 8.0
    - 9.0
    - 10.0
    - 11.0
    - 12.0

  # Fallback threshold when too few benchmark rows exist to fit the interaction model.
  default_bit_stress_threshold: 8.0

  # Minimum benchmark rows required before fitting the interaction correction.
  minimum_fit_rows: 12

candidate_selection:
  # Phase 2: a hybrid can replace the smaller/higher-damage anchor when it fits
  # inside this size premium and beats the real linear KLD improvement line.
  near_baseline_max_size_growth_percent: 1.5

  # Phase 3: interior windows between adjacent final anchors.
  # [0.35, 0.35] means test the first 35% of the size span, then the next 35%.
  interior_window_fractions:
    - 0.35
    - 0.35

  # Number of predicted winners to keep per interior window.
  max_candidates_per_interior_window: 1

  # If the first predicted candidate fails real validation, try this many fallbacks.
  max_fallback_attempts_per_anchor: 5

  # Strict epsilon for lower-KLD comparisons after real benchmark validation.
  minimum_kld_improvement_epsilon: 1.0e-9

  # Final spacing pass: candidates closer than this fraction of the global survivor
  # size span are collapsed unless one genuinely earns the slot.
  minimum_neighbor_gap_fraction_of_global_span: 0.03

  # Extra-brutal zone near the smaller anchor. A candidate this close to the smaller
  # anchor must provide a stronger KLD gain to justify its existence.
  near_lower_anchor_brutal_zone_fraction_of_pair_span: 0.02
  near_anchor_required_kld_gain_fraction_of_pair_gap: 0.05

  # Default false: do not spend final prediction/build attempts trying to replace
  # 8-bit anchors such as Q8_0 during strict dominance or near-anchor replacement.
  # Q8 is treated as the highest-fidelity practical anchor unless this is enabled.
  allow_eight_bit_anchor_replacements: true

anomaly_detection:
  enabled: true

  # One anomaly refinement pass after smoke/probe/rule generation.
  max_anomaly_refinement_rounds: 1

  # Minimum actual KLD gain versus higher-bit counterfactual twin to confirm anomaly.
  min_actual_gain_vs_twin_kld: 0.00025

  # Minimum predicted size savings versus higher-bit twin/reference to probe.
  min_predicted_size_savings_vs_twin_percent: 1.0

  # Max changed groups in a candidate that can seed contextual probes.
  max_probe_group_count: 4

  # Max probes generated per anomaly seed.
  max_probes_per_seed: 16

  # Max anomaly probes in one run.
  max_total_probes_per_run: 32

  # Strong smoke if a monotone downgrade candidate is this close to or better than its twin in prediction space.
  max_prediction_space_gap_vs_twin_kld: 0.00050

  # Optional relative cap for prediction-space gap normalized by local anchor gap.
  max_relative_prediction_penalty_vs_twin: 0.35

  # Minimum margin used when forcing confirmed anomalies below their higher-bit twin in prediction space.
  prediction_space_violation_margin: 0.00005

  # Shrink applied to prediction-space adjustment after a rule is confirmed.
  anomaly_adjustment_shrink_factor: 0.50

  # Minimum confidence required before applying a confirmed anomaly rule.
  min_rule_confidence_to_apply: 0.50

  # Absolute cap on total negative anomaly adjustment in prediction-space KLD units.
  max_negative_adjustment_kld: 0.00075

  # Absolute cap on positive harmful interaction adjustment in prediction-space KLD units.
  max_positive_adjustment_kld: 0.00075

  # Fractional cap relative to BaseRankSafeKld.
  max_adjustment_fraction_of_base_kld: 0.75

  # Number of top smoke candidates to consider per reference quant zone.
  max_smoke_candidates_per_reference_zone: 12

  # Store suppression-only results so false smoke is not repeatedly probed.
  persist_suppression_results: true

  # Emit detailed anomaly logs.
  verbose_anomaly_logging: true

  # Small bounded sniff pass around already-confirmed beneficial contextual anomalies.
  confirmed_anomaly_expansion:
    enabled: true
    max_neighbors_per_confirmed_rule: 6
    max_total_expansion_probes: 12
    allowed_reference_quants:
      - Q8_0
    allowed_candidate_quants:
      - Q6_K
      - UD-Q6_K_XL
      - Q5_K
      - UD-Q5_K_XL

output:
  # Leave blank to default to <model>/MagicQuant/Final_Outputs
  output_dir:
  output_name_prefix: Qwen3.8-27B
  export_external_learned_baselines: false

  # false = normal behavior; delete/rebuild final outputs from scratch.
  # true = preserve valid existing GGUFs and skip rebuilding them only when
  # exact file name + byte size match benchmark truth.
  # CLI --reuse-existing-final-artifacts overrides YAML.
  reuse_existing_final_artifacts: false

