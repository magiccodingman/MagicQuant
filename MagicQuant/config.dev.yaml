paths:
  magic_quant_root:
  model_dir: /mnt/world8/AI/Models/Qwen3-4B-Instruct-2507-unsloth/
  llama_root:
  llama_bin:
  convert_script:
  external_baseline_cache_dir_name: ExternalBaselines

flags:
  use_imatrix: true
  force_imatrix_rebuild: false
  force_relearn_baseline_tensor_mappings: false
  force_refresh_hardware_probe: false
  allow_high_precision_hybrids: false

imatrix:
  imatrix_url:
  dataset_repo:
  dataset_split: text
  dataset_config:
  dataset_local_file: /home/slurp/Documents/Output_Files/Dataset/artifacts/imatrix-general-v1-1m.jsonl

evolution:
  max_data_collected_per_category: 5
  max_survival_rounds: 4
  collapse_multiplier: 1.5
  brute_force_final_combination_threshold: 12000

isolation_pruning:
  # 0.04 is the goal, but this is currently causing prediction issues, leave at 0
  minimum_isolation_reduction_to_continue_ratio: 0.00
  minimum_isolation_reduction_to_suppress_bf16_ratio: 0.10
  maximum_isolation_ppl_delta_percent: 5.0
  maximum_isolation_kld: 0.1
  bad_trade_max_size_delta_percent: 4.0
  bad_trade_kld_multiplier: 2.5
  bad_trade_ppl_multiplier: 3.5
  floating_point_epsilon: 1.0e-8
  minimum_meaningful_base_only_reduction_ratio: 0.01

prediction:
  manual_max_predicted_size_bytes: 0

output:
  # Leave blank to default to <model>/MagicQuant/Final_Outputs
  output_dir:
  output_name_prefix: model
  export_external_learned_baselines: false

survival:
  max_selected_choices_per_bucket: 5
  meaningful_size_bias_percent: 1.0
  kld_close_call_absolute_epsilon: 0.00075
  kld_close_call_relative_fraction: 0.02
  ppl_large_difference_percent: 0.75
  trade_score_size_bias_weight: 1.25
  trade_score_ppl_weight: 0.15

identity:
  architecture_family_name: Qwen3-4B-Instruct-2507
  allow_architecture_family_alias_override: false

baselines:
  standard_baselines_mode: all
  enabled_standard_learning_baselines: []
  enabled_standard_combination_carriers: []
  enabled_standard_explicit_group_candidates: []

  custom_repositories:
    - repo_id: unsloth/Qwen3-4B-Instruct-2507-GGUF
      enabled: true
      short_source_name: Unsloth
      source_kind: huggingface_gguf_repository
      require_all_includes_to_resolve: true
      validate_tensor_names_against_source_model: true
      delete_partial_or_dirty_downloads: true
      resume_or_retry_downloads: true

      allow_as_learning_baseline: true
      allow_as_combination_carrier: false
      allow_as_explicit_group_candidate: false

      includes:
        - file_name: Qwen3-4B-Instruct-2507-UD-Q4_K_XL.gguf
          baseline_family: Q4_K_M
          quantize_base_name: Q4_K_M
          display_name: Unsloth_Q4_K_XL
          allow_as_learning_baseline: true
          allow_as_combination_carrier: false
          allow_as_explicit_group_candidate: true

        - file_name: Qwen3-4B-Instruct-2507-UD-Q5_K_XL.gguf
          baseline_family: Q5_K
          quantize_base_name: Q5_K
          display_name: Unsloth_Q5_K_XL
          allow_as_learning_baseline: true
          allow_as_combination_carrier: false
          allow_as_explicit_group_candidate: true

        - file_name: Qwen3-4B-Instruct-2507-UD-Q6_K_XL.gguf
          baseline_family: Q6_K
          quantize_base_name: Q6_K
          display_name: Unsloth_Q6_K_XL
          allow_as_learning_baseline: true
          allow_as_combination_carrier: true
          allow_as_explicit_group_candidate: true

        - file_name: Qwen3-4B-Instruct-2507-UD-Q3_K_XL.gguf
          baseline_family: IQ3_S
          quantize_base_name: IQ3_S
          display_name: Unsloth_Q3_K_XL
          allow_as_learning_baseline: true
          allow_as_combination_carrier: false
          allow_as_explicit_group_candidate: true

        - file_name: Qwen3-4B-Instruct-2507-UD-IQ3_XXS.gguf
          baseline_family: IQ3_XS
          quantize_base_name: IQ3_XS
          display_name: Unsloth_IQ3_XXS_for_IQ3_XS
          allow_as_learning_baseline: true
          allow_as_combination_carrier: false
          allow_as_explicit_group_candidate: true
